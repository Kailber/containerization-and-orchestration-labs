apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    app: {{ .Release.Name }}
    grafana_dashboard: "1"
data:
  shop.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": "prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "textMode": "auto"},
          "targets": [{"expr": "sum(up{namespace=\"{{ .Release.Namespace }}\", service=~\"{{ .Release.Name }}-(api|worker)\"})", "refId": "A"}],
          "title": "Scrape targets up",
          "type": "stat"
        },
        {
          "datasource": "prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "textMode": "auto"},
          "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=\"{{ .Release.Namespace }}\", deployment=\"{{ .Release.Name }}-api\"}", "refId": "A"}],
          "title": "API available replicas",
          "type": "stat"
        },
        {
          "datasource": "prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "textMode": "auto"},
          "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=\"{{ .Release.Namespace }}\", deployment=\"{{ .Release.Name }}-worker\"}", "refId": "A"}],
          "title": "Worker available replicas",
          "type": "stat"
        },
        {
          "datasource": "prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "textMode": "auto"},
          "targets": [{"expr": "sum(kube_pod_status_ready{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ .Release.Name }}-postgres-[0-9]+\", condition=\"true\"})", "refId": "A"}],
          "title": "PostgreSQL ready instances",
          "type": "stat"
        },
        {
          "datasource": "prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 6},
          "id": 5,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}},
          "targets": [{"expr": "sum(shop_orders_created_total)", "legendFormat": "created", "refId": "A"}],
          "title": "Orders created by running API processes",
          "type": "timeseries"
        },
        {
          "datasource": "prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 6},
          "id": 6,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}},
          "targets": [{"expr": "sum(shop_orders_processed_total)", "legendFormat": "processed", "refId": "A"}],
          "title": "Orders processed by running worker processes",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["shop", "lab3"],
      "time": {"from": "now-15m", "to": "now"},
      "timezone": "browser",
      "title": "Shop — Lab 3",
      "uid": "shop-lab3",
      "version": 1
    }
