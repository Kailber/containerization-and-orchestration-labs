apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    app: {{ .Release.Name }}
    grafana_dashboard: "1"
data:
  shop-lab4.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "title": "API: available replicas",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"{{ .Release.Namespace }}\",deployment=\"{{ .Release.Name }}-api\"}",
              "refId": "A",
              "legendFormat": "API: available replicas"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "title": "PostgreSQL: ready instances",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ .Release.Name }}-postgres-[0-9]+\",condition=\"true\"}) or vector(0)",
              "refId": "A",
              "legendFormat": "PostgreSQL: ready instances"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "title": "Batch: available replicas",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"{{ .Release.Namespace }}\",deployment=\"{{ .Release.Name }}-batch\"}",
              "refId": "A",
              "legendFormat": "Batch: available replicas"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "title": "Batch: Evicted Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_reason{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ .Release.Name }}-batch-.*\",reason=\"Evicted\"}) or vector(0)",
              "refId": "A",
              "legendFormat": "Batch: Evicted Pods"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "title": "Orders created per second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(shop_orders_created_total{namespace=\"{{ .Release.Namespace }}\"}[1m]))",
              "refId": "A",
              "legendFormat": "Orders created per second"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 6,
          "title": "Orders processed per second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(shop_orders_processed_total{namespace=\"{{ .Release.Namespace }}\"}[1m]))",
              "refId": "A",
              "legendFormat": "Orders processed per second"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 7,
          "title": "Working set: shop containers",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\",container=~\"api|worker|postgres|batch\",image!=\"\"}",
              "refId": "A",
              "legendFormat": "{{ "{{pod}}" }} / {{ "{{container}}" }}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 8,
          "title": "CPU throttled periods: critical path",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * rate(container_cpu_cfs_throttled_periods_total{namespace=\"{{ .Release.Namespace }}\",container=~\"api|postgres\",image!=\"\"}[1m]) / clamp_min(rate(container_cpu_cfs_periods_total{namespace=\"{{ .Release.Namespace }}\",container=~\"api|postgres\",image!=\"\"}[1m]), 0.001)",
              "refId": "A",
              "legendFormat": "{{ "{{pod}}" }} / {{ "{{container}}" }}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 9,
          "title": "Node MemoryPressure (1 = pressure)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_node_status_condition{node=~\"lab4-.*\",condition=\"MemoryPressure\",status=\"true\"}",
              "refId": "A",
              "legendFormat": "{{ "{{node}}" }}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 10,
          "title": "Batch Pending Pods",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ .Release.Name }}-batch-.*\",phase=\"Pending\"}) or vector(0)",
              "refId": "A",
              "legendFormat": "Batch Pending Pods"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "shop",
        "lab4"
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Shop — Lab 4: overload",
      "uid": "shop-lab4",
      "version": 1
    }
