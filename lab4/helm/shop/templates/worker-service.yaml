apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    monitoring: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.worker.port }}
      targetPort: http
