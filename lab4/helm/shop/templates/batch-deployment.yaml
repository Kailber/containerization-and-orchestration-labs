apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-batch
  labels:
    app: batch
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.batch.replicas }}
  {{- with .Values.batch.rollingUpdate }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  selector:
    matchLabels:
      app: batch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: batch
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      priorityClassName: {{ printf "%s-%s" .Release.Name .Values.batch.priorityClass | quote }}
      {{- with .Values.batch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: batch
          image: "{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.batch.image.pullPolicy }}
          env:
            - name: CPU_WORKERS
              value: {{ .Values.batch.cpuWorkers | quote }}
            - name: MEMORY_MIB
              value: {{ .Values.batch.memoryMiB | quote }}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
