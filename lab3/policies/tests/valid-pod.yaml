apiVersion: v1
kind: Pod
metadata:
  name: test-valid
  namespace: lab3
  labels:
    app: policy-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
  containers:
    - name: test
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false