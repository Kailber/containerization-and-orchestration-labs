apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-limits
  annotations:
    policies.kyverno.io/title: "Обязательные лимиты ресурсов"
    policies.kyverno.io/description: >-
      Требует указания лимитов CPU и памяти у каждого обычного
      контейнера Pod для ограничения потребления ресурсов контейнером
spec:
  background: true
  rules:
    - name: check-container-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      validate:
        failureAction: Enforce
        failureActionOverrides:
          - action: Audit
            namespaces:
              - lab2
        message: "У каждого контейнера должны быть лимиты CPU и памяти"
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"