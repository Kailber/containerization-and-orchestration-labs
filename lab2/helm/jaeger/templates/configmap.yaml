apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  config.yaml: |
    extensions:
      jaeger_storage:
        backends:
          lab:
            memory:
              max_traces: {{ .Values.storage.maxTraces }}
      jaeger_query:
        storage:
          traces: lab
        http:
          endpoint: 0.0.0.0:16686
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
    exporters:
      jaeger_storage_exporter:
        trace_storage: lab
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
