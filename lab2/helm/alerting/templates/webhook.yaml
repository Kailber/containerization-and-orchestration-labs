apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-webhook
data:
  webhook.py: |
{{ .Files.Get "files/webhook.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: alert-webhook
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/script: {{ .Files.Get "files/webhook.py" | sha256sum }}
    spec:
      containers:
        - name: webhook
          image: {{ .Values.webhook.image | quote }}
          command: ["python", "-u", "/app/webhook.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
{{ toYaml .Values.webhook.resources | indent 12 }}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webhook
spec:
  selector:
    app: alert-webhook
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
