apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-karma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karma
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: karma
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: karma
          image: {{ .Values.karma.image | quote }}
          env:
            - name: ALERTMANAGER_URI
              value: {{ .Values.karma.alertmanagerURL | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          resources:
{{ toYaml .Values.karma.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-karma
spec:
  selector:
    app: karma
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
