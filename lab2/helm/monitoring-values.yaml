grafana:
  enabled: true

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  
  additionalDataSources:
    - name: loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.lab2.svc.cluster.local
      editable: false

prometheus:
  prometheusSpec:
    retention: 2d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

    serviceMonitorSelector:
      matchLabels:
        release: monitoring

    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: lab2

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
