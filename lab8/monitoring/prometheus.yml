
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

storage:
  tsdb:
    retention:
      time: 7d

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: release-notes-exporter
    static_configs:
      - targets: ["release-notes-exporter:9800"]
