apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  instances: {{ .Values.postgres.instances }}
  inheritedMetadata:
    labels:
      app: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database | quote }}
      owner: {{ .Values.postgres.owner | quote }}
  storage:
    size: {{ .Values.postgres.storageSize | quote }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
