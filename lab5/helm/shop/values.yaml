database:
  existingSecret: ""
  secretKey: uri

postgres:
  instances: 1
  database: shop
  owner: shop
  storageSize: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  replicas: 3

  service:
    type: NodePort
    nodePort: 30080

  image:
    repository: lab3-api
    tag: v3
    pullPolicy: Never

  port: 8080
  healthFail: false

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

worker:
  replicas: 2

  image:
    repository: lab3-worker
    tag: v2
    pullPolicy: Never

  port: 8082

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

monitoring:
  enabled: true
  namespace: lab2
  releaseLabel: monitoring
  interval: 15s
  alerts:
    for: 1m
    apiMinReplicas: 3
    workerMinReplicas: 2

networkPolicy:
  enabled: true

  api:
    labels:
      app: api
      app.kubernetes.io/instance: shop
    port: 8080

  worker:
    labels:
      app: worker
      app.kubernetes.io/instance: shop
    port: 8082

  postgres:
    labels:
      cnpg.io/cluster: shop-postgres
    port: 5432
    monitorPort: 8000

  client:
    labels:
      run: test-client

  dns:
    namespace: kube-system
    port: 53

  cnpg:
    namespace: cnpg-system

  monitoring:
    namespace: lab2
