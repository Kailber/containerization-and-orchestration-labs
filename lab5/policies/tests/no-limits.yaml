apiVersion: v1
kind: Pod
metadata:
  name: test-no-limits
  namespace: lab3
  labels:
    app: policy-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
  containers:
    - name: test
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false