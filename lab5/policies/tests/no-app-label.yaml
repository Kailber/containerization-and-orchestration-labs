apiVersion: v1
kind: Pod
metadata:
  name: test-no-app-label
  namespace: lab3
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
  containers:
    - name: test
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false