apiVersion: v1
kind: Pod
metadata:
  name: test-root
  namespace: lab3
  labels:
    app: policy-test
spec:
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
  containers:
    - name: test
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false